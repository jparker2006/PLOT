[project]
name = "plot"
version = "0.1.0"
description = "PLOT — Points Left On the Table: an open per-action value layer and decision-regret metric for NBA possessions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "polars>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "huggingface-hub>=0.24",
    "datasets>=2.20",
    "py7zr>=0.21",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# The sequence EPV model (Stage 2 upgrade). Kept out of the base install: it is the only
# torch dependency, Kaggle/Colab images already ship torch, and the CPU baseline + all data
# code run without it. Locally: `uv sync --extra seq` (installs the MPS/CPU build on macOS).
seq = [
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plot"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
