# PLOT default configuration.
seed: 1729

data:
  hf_repo: "dcayton/nba_tracking_data_15_16"
  hf_repo_type: "dataset"
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  subset_tier: "T0"        # T0=1 game, T1=~5 games, T2=team/HF-small, T3=full season
  model_fps: 10            # downsample tracking to this rate for modeling
  demo_fps: 25             # keep full rate only for demo clips

# SportVU coordinate system is in feet; full court is 94 x 50.
# Values below are standard NBA geometry — VERIFY against the real data in Stage 1.
court:
  length_ft: 94.0
  width_ft: 50.0
  hoop_left_x_ft: 5.25
  hoop_right_x_ft: 88.75
  hoop_y_ft: 25.0
  rim_radius_ft: 0.75
  three_point_radius_ft: 23.75
  corner_three_x_ft: 22.0

openness:
  open_ft: 4.0             # nearest defender >= 4 ft  -> "open"
  wide_open_ft: 6.0        # nearest defender >= 6 ft  -> "wide open"

regret:
  report_clipped: true
  report_signed: true
  chosen_value_basis: "expected"   # "expected" (model EV) vs "realized"

eval_bar:                  # Stage 2 baseline EPV ("eval bar")
  n_classes: 4             # points outcome head {0,1,2,3}; rare 4-pt clamped to 3
  fps_bucket_ms: 100       # downsample 25 -> ~10 fps by wall-clock bucket
  deep_margin_ft: 20.0     # orientation: ball deep-frontcourt threshold (|x-47|)
  orientation_min_frames: 200
  orientation_strong_ft: 5.0
  backcourt_quarantine: 0.40   # QC: quarantine a game whose canonical backcourt fraction exceeds this
  handler_ball_max_ft: 6.0     # offensive player within this of the ball = ball-handler
  lightgbm:
    num_leaves: 31
    learning_rate: 0.03
    feature_fraction: 0.8
    bagging_fraction: 0.8
    lambda_l2: 1.0
    min_child_samples: 200
    min_data_in_bin: 50
    num_boost_round: 400
    early_stopping_rounds: 50   # mirrors the code default; loaded live by scripts/train_eval_bar_g1.py
  reliability_bins: 15
  bootstrap_B: 400

seq_epv:                   # Stage 2 UPGRADE: sequence EPV (per-player set encoder -> causal GRU)
  # Shares the eval_bar target {0,1,2,3}, the clean-game/quarantine split, and calibration.py,
  # so its G1 is directly comparable to the baseline. Goal: beat the baseline + tighten slope.
  player_embed_dim: 64     # per-player shared MLP width (DeepSets phi)
  frame_embed_dim: 96      # frame embedding after set pooling + ball/context concat
  gru_hidden: 128          # causal GRU hidden size (unidirectional -> no future leakage)
  gru_layers: 1
  dropout: 0.1
  encoder: "deepsets"      # "deepsets" (off/def masked mean+max pool) | "attention" (future)
  lr: 0.001
  weight_decay: 0.00001
  batch_possessions: 64    # batch unit is the POSSESSION (padded in time)
  min_epochs: 5            # never freeze a barely-trained model on a noisy single-game val signal
  max_epochs: 40
  patience: 6              # early stop on inner-val weighted frame logloss (after min_epochs)
  grad_clip: 5.0
  max_frames: 320          # cap a possession's frame count (keep the most recent; ~32 s at 10 fps)

demo_games:
  kobe_farewell:
    date: "2016-04-13"
    home: "Lakers"
    away: "Jazz"
  lebron_cavs: null        # choose a regular-season Cavs game once data is verified
